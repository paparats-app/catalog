name: Suggest an app
description: An app for the catalog, yours or someone else's.
title: "Suggest: "
labels: [suggestion]
body:
  - type: markdown
    attributes:
      value: |
        Paparats installs apps straight from their authors' GitHub Releases. Before you suggest one,
        please check that the app publishes a Windows build there, has a license that allows free
        use, and shows no ads. Young projects can go to the Rising shelf: use the other template.
  - type: input
    id: repo
    attributes:
      label: Repository
      description: The app's official repository on GitHub.
      placeholder: https://github.com/owner/name
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What it does
      description: One or two sentences, as you would tell a friend.
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: Windows file in the latest release
      description: The installer, MSI, MSIX, ZIP or single EXE people should get.
      placeholder: App-1.2.3-x64-setup.exe
    validations:
      required: true
  - type: textarea
    id: install
    attributes:
      label: Silent install and detection (if you know)
      description: |
        Arguments for a silent install (for example /S or /VERYSILENT), whether it installs for
        the current user or asks for administrator rights, and the name it shows in
        "Installed apps".
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The app has no ads, bundled offers or hidden data collection.
          required: true
        - label: I am the author of this app.
